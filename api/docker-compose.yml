services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3333

      APP_SECRET: "dev-secret-change-me"
      APP_URL: "http://localhost:3333"

      DATABASE_URL: mysql://root:root@mysql:3306/beautyon

      QUEUE_POLL_INTERVAL_MS: "2000"
      QUEUE_MAX_ATTEMPTS: "5"

      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_USER: ""
      MAIL_PASS: ""

    ports:
      - "3333:3333"
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: beautyon
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 40s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  app_node_modules:
  mysql_data:

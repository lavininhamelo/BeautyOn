services:
  web:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_OPTIONS: --openssl-legacy-provider
      WATCHPACK_POLLING: "true"
    stdin_open: true
    tty: true

volumes:
  web_node_modules:
